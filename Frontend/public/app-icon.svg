<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12b886"/>
      <stop offset="1" stop-color="#099268"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (safe for maskable; OS applies its own mask) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Bar-chart mark: accounts / analytics. Kept inside the center safe zone. -->
  <g fill="#ffffff">
    <rect x="130" y="274" width="60" height="96"  rx="16" opacity="0.85"/>
    <rect x="226" y="214" width="60" height="156" rx="16" opacity="0.92"/>
    <rect x="322" y="154" width="60" height="216" rx="16"/>
  </g>
  <!-- Baseline -->
  <rect x="118" y="380" width="276" height="12" rx="6" fill="#ffffff" opacity="0.9"/>
</svg>
